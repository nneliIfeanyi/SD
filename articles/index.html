<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#005751" />
  <link rel="manifest" href="site.webmanifest" />
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
  <link rel="icon" href="../icons/favicon-32x32.png" sizes="32x32" />
  <link rel="icon" href="../icons/favicon-16x16.png" sizes="16x16" />
  <title>Suleja Disciples Blog</title>
  <!-- Bootstrap 5 CSS -->
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <!-- Google Fonts: Inter (UI) + Source Serif 4 (reading) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap"
    rel="stylesheet" />
  <!-- Custom Styles -->
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="app-shell">

  <!-- ============================= -->
  <!-- HEADER / NAVBAR                -->
  <!-- ============================= -->
  <header class="app-header sticky-top">
    <nav class="navbar navbar-expand-md">
      <div class="container-fluid px-3 px-md-4">

        <!-- Hamburger (mobile only) -->
        <button class="btn btn-icon d-md-none me-2" type="button" data-bs-toggle="offcanvas"
          data-bs-target="#blogOffcanvas" aria-controls="blogOffcanvas" aria-label="Open blog list">
          <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Brand dhows on medium and larger screens -->
        <a class="navbar-brand d-none d-md-flex align-items-center gap-2" href="index.html">
          <span class="brand-mark">
            <i class="bi bi-pen"></i>
          </span>
          <span class="brand-title">SD Blog</span>
        </a>

        <!-- Right side controls -->
        <div class="d-flex align-items-center ms-auto gap-2 gap-md-3">
          <!-- Back to homepage -->
          <a href="../index.html#team" class="btn btn-primary btn-sm rounded-pill align-items-center gap-1">
            <i class="bi bi-arrow-left"></i>
            <span class="">Homepage</span>
          </a>

          <!-- Click to view Bookmarks-->
          <button type="button" class="btn btn-icon position-relative" id="bookmarkBtn" data-bs-toggle="modal"
            data-bs-target="#bookmarksModal" aria-label="View bookmarks">
            <i class="bi bi-bookmark"></i>
            <span class="position-absolute top-0 end-0 badge rounded-pill bg-danger" id="bookmarkCount"
              style="font-size:0.65rem; padding:0.16rem 0.35rem; line-height:1;">0</span>
          </button>
        </div>
      </div>
    </nav>
    <!-- Reading progress bar (fills in when an article is open) -->
    <div class="reading-progress" id="readingProgress"></div>
  </header>

  <!-- ============================= -->
  <!-- MAIN CONTENT                   -->
  <!-- ============================= -->
  <main class="app-main">
    <div class="container-fluid h-100 px-0">
      <div class="row g-0 h-100">

        <!-- ===================== LEFT PANEL (Desktop) ===================== -->
        <aside class="col-md-3 col-lg-3 d-none d-md-flex flex-column blog-panel">
          <div id="blogListDesktop" class="blog-list-scroll flex-grow-1"></div>
        </aside>

        <!-- ===================== RIGHT PANEL ===================== -->
        <section class="col-md-9 col-lg-9 blog-detail-panel">
          <div id="detailContent" class="detail-content h-100">
            <!-- Empty state / blog detail / skeleton injected here by JS -->
          </div>
        </section>

      </div>
    </div>
  </main>

  <!-- ============================= -->
  <!-- OFFCANVAS (Mobile blog list)   -->
  <!-- ============================= -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="blogOffcanvas" aria-labelledby="blogOffcanvasLabel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title d-flex align-items-center gap-2" id="blogOffcanvasLabel">
        <i class="bi bi-pen"></i> SD Blog
      </h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column p-0">
      <div id="blogListMobile" class="blog-list-scroll flex-grow-1"></div>
    </div>
  </div>

  <!-- ============================= -->
  <!-- FAVORITE TOAST                 -->
  <!-- ============================= -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080">
    <div id="favToast" class="toast align-items-center border-0" role="status" aria-live="polite" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2">
          <i class="bi bi-heart-fill text-danger" id="favToastIcon"></i>
          <span id="favToastMsg">Added to favorites</span>
        </div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <!-- ============================= -->
  <!-- DELETE CONFIRMATION MODAL      -->
  <!-- ============================= -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="deleteModalLabel">Delete this post?</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <p class="text-muted mb-0">
            "<span id="deletePostTitle"></span>" will be permanently removed. This can't be undone.
          </p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-outline-secondary rounded-pill px-3"
            data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-danger rounded-pill px-3" id="confirmDeleteBtn">
            <span id="confirmDeleteLabel"><i class="bi bi-trash me-1"></i>Delete post</span>
            <span id="confirmDeleteSpinner" class="spinner-border spinner-border-sm d-none" role="status"
              aria-hidden="true"></span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================= -->
  <!-- BOOKMARKS MODAL               -->
  <!-- ============================= -->
  <div class="modal fade" id="bookmarksModal" tabindex="-1" aria-labelledby="bookmarksModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title" id="bookmarksModalLabel">Your bookmarks</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body pt-2">
          <div id="bookmarksList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================= -->
  <!-- FOOTER                         -->
  <!-- ============================= -->
  <footer class="app-footer">
    <div class="container-fluid px-3 py-2">
      <div class="align-items-center">
        <div class="text-center">
          <small style="font-size: small;" class="text-muted">&copy; 2026 Suleja Disciples. All rights reserved.
            Reproduction in whole or in part
            without permission is prohibited.</small>
        </div>
      </div>
    </div>
  </footer>
  <!-- Service worker entry point-->
  <script src="js/app.js"></script>
  <!-- Bootstrap 5 JS Bundle -->
  <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
  <!-- Shared config (API base URL) -->
  <script src="js/config.js"></script>
  <!-- App logic (fetches posts from the PHP API) -->
  <script src="js/script.js"></script>
</body>

</html>
